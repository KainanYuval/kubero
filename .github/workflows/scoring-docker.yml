name: Scoring Docker Build

on:
  push:
    branches:
      - 'scoring-run-*'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1
        with:
          url: https://devopspaper.jfrog.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            devopspaper.jfrog.io/docker/kainanyuval/kubero:${{ github.sha }}
            devopspaper.jfrog.io/docker/kainanyuval/kubero:scoring-latest
